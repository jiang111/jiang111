<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Emby 账号导出</title>
<style>
/* 和面板同一套视觉语言：系统字体、分组背景、圆角卡片、系统蓝；随系统浅色 / 深色切换 */
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#000;--muted:rgba(60,60,67,.6);--line:rgba(60,60,67,.14);
  --primary:#007aff;--tint:rgba(0,122,255,.1);--danger:#ff3b30;--warn:#ff9500;--chip:rgba(118,118,128,.12);--hud:rgba(28,28,30,.86);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--ease:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:rgba(235,235,245,.6);--line:rgba(84,84,88,.55);
  --primary:#0a84ff;--tint:rgba(10,132,255,.18);--danger:#ff453a;--warn:#ff9f0a;--chip:rgba(118,118,128,.24);--hud:rgba(58,58,60,.92);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
main{max-width:760px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:8px 0 16px}
.warn{background:color-mix(in srgb,var(--warn) 13%,var(--card));border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:18px;line-height:1.55}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.tag{font-size:11.5px;font-weight:500;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px}
.group{background:var(--chip);border-radius:12px;overflow:hidden}
.kv{display:flex;gap:8px;align-items:center;font-size:13.5px;min-width:0;padding:8px 8px 8px 12px;min-height:42px}
.kv + .kv{box-shadow:0 -.5px 0 var(--line)}
.kv span{color:var(--muted);flex:none;width:52px}
.kv code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.btn{border:0;background:var(--tint);color:var(--primary);padding:7px 14px;border-radius:10px;font-family:inherit;font-weight:600;font-size:13.5px;line-height:1.3;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.pri{background:var(--primary);color:#fff}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:12px}
.links a{flex-direction:column;padding:10px 6px;line-height:1.25;border-radius:12px;text-align:center;min-height:52px}
.links a small{display:block;font-size:10.5px;font-weight:400;opacity:.75;margin-top:3px;white-space:normal}
.links a.pri small{opacity:.85}
.muted{color:var(--muted);font-size:12.5px}
.err{color:var(--danger)}
textarea{width:100%;min-height:220px;border:0;border-radius:12px;background:var(--chip);color:var(--text);padding:10px 12px;font:12px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--hud);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:9;max-width:calc(100vw - 32px);transition:opacity .25s ease,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
ul{padding-left:18px;margin:8px 0 0;line-height:1.7}
@media (prefers-reduced-motion: reduce){*{transition-duration:.1s !important}.btn:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.toast{background:#1c1c1e;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<main>
<h1>Emby 账号导出</h1>
<div class="warn">这个页面包含全部 Emby 账号和密码，请不要截图或转发。导出链接一旦泄露，请到面板「导出账号」里重新生成，旧链接会立即失效。<br>
在手机上点按钮会打开对应的播放器，一个按钮导入一台服务器。</div>
<div id="app"><div class="muted">加载中…</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'text' ? e.textContent = v : e.setAttribute(k, v);
  kids.forEach(k => k && e.append(k));
  return e;
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast('已复制' + what); }
  catch (e) { toast('复制失败，请长按手动复制'); }
}
// 文本格式和常见 Emby 机器人发的一样：SenPlayer 新建服务器时可以识别剪贴板里的这段内容
const block = s => `名称：${s.name}\n地址：${s.url}\n用户名：${s.username}\n密码：${s.password}`;
function download(name, text, type) {
  const a = el('a', {href: URL.createObjectURL(new Blob([text], {type})), download: name});
  document.body.append(a); a.click(); a.remove();
}

// 导出密码只在链接里出现一次：读出来后从地址栏和浏览历史里去掉，刷新时从本标签页的 sessionStorage 取
let key = new URLSearchParams(location.search).get('key') || '';
try {
  if (key) sessionStorage.setItem('ep_export_key', key); else key = sessionStorage.getItem('ep_export_key') || '';
} catch (e) {}
if (location.search) history.replaceState(null, '', location.pathname);

async function load() {
  const app = $('#app');
  if (!key) { app.innerHTML = '<div class="card err">链接里缺少导出密码，请到面板「导出账号」复制完整的导出链接。</div>'; return; }
  let d;
  try {
    const r = await fetch('/export/data', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Emby-Proxy': '1'}, body: JSON.stringify({key})});
    d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  } catch (e) {
    app.replaceChildren(el('div', {class: 'card err', text: e.message}));
    return;
  }
  app.replaceChildren();
  if (!d.sites.length) app.append(el('div', {class: 'card', text: '还没有站点保存了 Emby 账号。'}));
  for (const s of d.sites) {
    const pw = el('code', {text: '••••••'});
    let shown = false;
    const showBtn = el('button', {class: 'btn sm', text: '显示'});
    showBtn.onclick = () => { shown = !shown; pw.textContent = shown ? s.password : '••••••'; showBtn.textContent = shown ? '隐藏' : '显示'; };
    const cp = (text, what) => { const b = el('button', {class: 'btn sm', text: '复制'}); b.onclick = () => copy(text, what); return b; };
    const links = el('div', {class: 'links'});
    for (const l of s.links) links.append(el('a', {class: 'btn' + (l.id === 'senplayer' ? ' pri' : ''), href: l.url}, l.name, l.note ? el('small', {text: l.note}) : null));
    const copyAll = el('button', {class: 'btn sm', text: '复制文本'});
    copyAll.onclick = () => copy(block(s), '「' + s.name + '」的文本');
    app.append(el('div', {class: 'card'},
      el('h2', {}, s.name, s.disabled ? el('span', {class: 'tag', text: '站点已停用'}) : null),
      el('div', {class: 'group'},
        el('div', {class: 'kv'}, el('span', {text: '地址'}), el('code', {text: s.url}), cp(s.url, '地址')),
        el('div', {class: 'kv'}, el('span', {text: '用户名'}), el('code', {text: s.username}), cp(s.username, '用户名')),
        el('div', {class: 'kv'}, el('span', {text: '密码'}), pw, showBtn, cp(s.password, '密码'))),
      links,
      el('div', {class: 'row'}, copyAll, el('span', {class: 'muted', text: '复制后在 SenPlayer 新建服务器时可自动识别，其它播放器手动填写'}))));
  }
  if (d.skipped.length) app.append(el('div', {class: 'card muted'}, '没有导出：', el('ul', {}, ...d.skipped.map(x => el('li', {text: x})))));

  const all = d.sites.map(block).join('\n\n');
  const ta = el('textarea', {readonly: ''}); ta.value = all;
  const bCopy = el('button', {class: 'btn pri', text: '复制全部'}); bCopy.onclick = () => copy(all, '全部账号');
  const bTxt = el('button', {class: 'btn', text: '下载 txt'}); bTxt.onclick = () => download('emby-accounts.txt', all, 'text/plain;charset=utf-8');
  const bJson = el('button', {class: 'btn', text: '下载 json'});
  bJson.onclick = () => download('emby-accounts.json', JSON.stringify(d.sites.map(({name, url, username, password}) => ({name, url, username, password})), null, 2), 'application/json');
  app.append(el('div', {class: 'card'}, el('h2', {text: '文本清单'}),
    el('div', {class: 'muted', text: 'VidHub、Infuse、Yamby 等不支持链接导入的播放器，按这里的信息手动添加。'}),
    el('div', {class: 'row'}, bCopy, bTxt, bJson), ta));
  app.append(el('div', {class: 'card muted'}, el('b', {text: '说明'}), el('ul', {},
    el('li', {text: 'SenPlayer：官方支持（5.7.0 及以上），iPhone / iPad / Mac；Apple TV 通过 iCloud 同步。'}),
    el('li', {text: 'Rex：链接格式来自第三方，未实测；免费版只能添加 1 个资源库。'}),
    el('li', {text: 'Forward：官方支持，但 App 已下架，只对已经安装的有用。'}),
    el('li', {text: 'Hills：Android；小幻影视：Windows；EplayerX：链接格式来自第三方，未实测。'}),
    el('li', {text: '网易爆米花：没装 App 时会打开网易的网页，账号和密码会随链接发给网易。'}),
    el('li', {text: 'Telegram 里点不开播放器链接，请在浏览器里打开本页。'}))));
}
load();
</script>
</body>
</html>
